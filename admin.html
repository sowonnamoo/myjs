<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 알림 관리자</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBzHogA2iaUQqOOsNVL55stsdMH8lCQ4Ek",
        authDomain: "ecogr-636c6.firebaseapp.com",
        projectId: "ecogr-636c6",
        storageBucket: "ecogr-636c6.firebasestorage.app",
        messagingSenderId: "95745358447",
        appId: "1:95745358447:web:94cde53f6b36e6be95eb9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const listEl = document.getElementById("payment-list");
    const emptyEl = document.getElementById("empty-state");
    const sound = document.getElementById("notify-sound");

    let firstLoad = true;
    let knownIds = new Set();

    const q = query(collection(db, "webhook_payments"), orderBy("createdAt", "desc"), limit(50));

    onSnapshot(q, (snapshot) => {
        const docs = snapshot.docs;

        if (docs.length === 0) {
            emptyEl.classList.remove("hidden");
            listEl.innerHTML = "";
            firstLoad = false;
            return;
        }
        emptyEl.classList.add("hidden");

        // 새로 들어온 결제 감지 (최초 로드시에는 알림 안 울림)
        if (!firstLoad) {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added" && !knownIds.has(change.doc.id)) {
                    playNotify();
                    flashTitle();
                }
            });
        }

        listEl.innerHTML = "";
        docs.forEach((doc) => {
            knownIds.add(doc.id);
            const d = doc.data();
            listEl.appendChild(renderRow(d));
        });

        firstLoad = false;
    });

    function renderRow(d) {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-white rounded-lg shadow-sm px-5 py-4 border-l-4 border-blue-600";

        const amount = Number(d.amount || 0).toLocaleString();
        const time = d.paidAt ? new Date(d.paidAt).toLocaleString("ko-KR") : "";
        const method = methodLabel(d.payMethod);

        row.innerHTML = `
            <div>
                <div class="text-lg font-bold text-gray-800">${amount}원</div>
                <div class="text-sm text-gray-500 mt-1">${d.orderName || ""} · ${method}</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-400">${time}</div>
                <div class="text-xs text-gray-300 mt-1">${d.paymentId || ""}</div>
            </div>
        `;
        return row;
    }

    function methodLabel(type) {
        const map = {
            PaymentMethodCard: "카드",
            PaymentMethodVirtualAccount: "가상계좌",
            PaymentMethodEasyPay: "간편결제",
            PaymentMethodMobile: "휴대폰",
            PaymentMethodGiftCertificate: "상품권",
            PaymentMethodTransfer: "계좌이체",
        };
        return map[type] || type || "결제";
    }

    function playNotify() {
        // 볼륨을 최대로 강제 설정 (일부 브라우저는 기본 볼륨이 낮게 잡힐 수 있음)
        sound.volume = 1.0;

        // 한 번만 재생하면 소리가 짧고 작게 느껴질 수 있어 3번 연속 재생
        let playCount = 0;
        const playOnce = () => {
            sound.currentTime = 0;
            sound.play().catch(() => {});
        };
        const interval = setInterval(() => {
            playOnce();
            playCount++;
            if (playCount >= 3) clearInterval(interval);
        }, 700);
        playOnce();
    }

    let originalTitle = document.title;
    function flashTitle() {
        let count = 0;
        const interval = setInterval(() => {
            document.title = count % 2 === 0 ? "💰 결제 발생!" : originalTitle;
            count++;
            if (count > 6) { clearInterval(interval); document.title = originalTitle; }
        }, 600);
    }
</script>
</head>
<body class="bg-gray-100 min-h-screen">
    <audio id="notify-sound" preload="auto" volume="1">
        <source src="https://cdn.freesound.org/previews/411/411090_5121236-lq.mp3" type="audio/mpeg">
    </audio>

    <div class="max-w-2xl mx-auto py-10 px-4">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">결제 알림</h1>
        <p class="text-sm text-gray-500 mb-6">웹훅으로 확인된 결제 내역이 실시간으로 표시됩니다.</p>

        <div id="empty-state" class="hidden text-center text-gray-400 py-16">
            아직 들어온 결제가 없습니다.
        </div>

        <div id="payment-list" class="space-y-3"></div>
    </div>
</body>
</html>
