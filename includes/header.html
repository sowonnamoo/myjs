<style>
/* 1. 기본 스타일 */
* { box-sizing: border-box; }
.header-component { width: 1199px; margin: 0 auto; padding: 0; font-family: sans-serif; }
.header-top { display: flex; align-items: center; justify-content: space-between; height: 80px; width: 100%; padding: 0 10px; }

.header-right-wrap { display: flex; align-items: center; gap: 15px; }

/* 검색 스타일 */
.search-container { width: 250px; position: relative; }
.search-wrap { display: flex; align-items: center; background: #fff; border: 2px solid #ccc; border-radius: 40px; padding: 0 10px; height: 40px; }
.search-wrap input { border: none; width: 100%; outline: none; padding: 0 10px; }
.search-btn { 
    width: 15px; 
    height: 15px; 
    background: #68b600; 
    border-radius: 50%; 
    border: none; 
    cursor: pointer; 
    flex: 0 0 15px;           /* 찌그러짐 방지 */
    padding: 0; 
}

.search-suggestions { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 15px 15px; display: none; z-index: 1000; box-shadow:0 4px 6px rgba(0,0,0,.1); padding:5px 0; max-height: 320px; overflow-y: auto; }
.suggestion-item { padding:8px 20px; cursor:pointer; font-size:13px; line-height:1.4; }
.suggestion-item:hover { background:#f0f0f0; }
.suggestion-item .sg-leaf { color:#222; font-weight:bold; }
.suggestion-item .sg-path { color:#999; font-size:11px; }
.suggestion-item.suggestion-empty { color:#999; text-align:center; cursor:default; }
.suggestion-item.suggestion-empty:hover { background:transparent; }

/* 버튼 */
.icons { display:flex; gap:8px; }
.header-btn { height: 35px; padding: 0 16px; background: white; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; font-size: 14px; white-space: nowrap; }

/* 장바구니: 아이콘 + 담긴 개수 배지 */
.cart-btn { position: relative; padding: 0 12px; display: flex; align-items: center; justify-content: center; }
.cart-btn .cart-icon { display: block; }
.cart-count {
    position: absolute;
    top: -6px;
    right: 0px;
    background: #e74c3c;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    min-width: 16px;
    height: 16px;
    border-radius: 999px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
    box-sizing: border-box;
}

/* 메가메뉴 */
.mega-menu-wrap {
    width: 1199px;
    margin: 0 auto;
    margin-bottom: 40px;
    position: relative;
}
/* 회색 배경 + 위/아래 검은선을 화면 좌우 끝까지 확장. wrap 높이만큼만 차지하도록
   top:0/bottom:0으로 고정해서 아래로 펼쳐지는 메가패널(드롭다운)이 잘리지 않게 함. */
.mega-menu-wrap::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    background: #fcfcfc;
    border-top: 2px solid #333;
    border-bottom: 2px solid #333;
    z-index: -1;               /* 메뉴/드롭다운보다 항상 뒤에 있도록 */
    pointer-events: none;      /* 클릭/호버가 실제 메뉴에 그대로 전달되도록 */
}
.mega-menu-list { display: flex; justify-content: center; list-style: none; margin: 0; padding: 0; }
.menu-item { position: static; padding: 15px 20px; }
.menu-item > a { text-decoration: none; color: #333; font-weight: bold; }
.menu-item > a[onclick] { cursor: default; }

/* "전체상품보기" — 다른 카테고리와 똑같이 메가메뉴 아이템으로 동작(호버 시 패널이 열림) */

/* 메인페이지에서는 호버 없이도 이 패널이 항상 펼쳐진 상태로 보임 */
.all-products-item.force-open .mega-panel { display: block; }

/* 메가패널 (다단계 분류를 컬럼으로 표시) */

    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 1199px;
    max-height: 70vh;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #ddd;

/* "전체상품보기" 패널 안에서 대분류별로 구역을 나눠 보여줄 때 쓰는 스타일 */

<script>
// 장바구니 개수 배지: cart.html이 실제로 쓰는 저장소(IndexedDB, DB "ecogrHandoff" / 키 "ecogr_cart")를
// 그대로 읽어서 표시함. (예전엔 localStorage "cart"를 썼지만, 이미지 용량 문제로 cart.html이
// IndexedDB로 이미 옮겨간 상태라 여기도 같은 곳을 봐야 실제 담긴 개수랑 맞음)
const CART_DB_NAME = 'ecogrHandoff';
const CART_STORE_NAME = 'kv';
const CART_KEY = 'ecogr_cart';

function openCartDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(CART_DB_NAME, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(CART_STORE_NAME); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function getCartFromDB() {
    try {
        const db = await openCartDB();
        return await new Promise((resolve, reject) => {
            const tx = db.transaction(CART_STORE_NAME, 'readonly');
            const req = tx.objectStore(CART_STORE_NAME).get(CART_KEY);
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        });
    } catch (e) {
        console.error('장바구니를 불러오지 못했습니다:', e);
        return [];
    }
}

async function updateCartCount() {
    const cart = await getCartFromDB();
    const badge = document.getElementById('cartCount');
    if (!badge) return;
    if (cart.length > 0) {
        badge.textContent = cart.length > 99 ? '99+' : cart.length;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}
updateCartCount();
// 뒤로가기(bfcache)로 이 페이지에 돌아왔을 때도 배지 다시 갱신
window.addEventListener('pageshow', updateCartCount);

// 장바구니 버튼 클릭 시: 비어있으면 이동하지 않고 경고창만 띄움
async function goToCart() {
    const cart = await getCartFromDB();
    if (cart.length === 0) {
        alert('장바구니가 비어있습니다.');
        return;
    }
    location.href = '/myjs/includes/cart.html';
}

/* ---------------- PC 메가메뉴 렌더링 (다단계 컬럼형) ---------------- */

// 하위 트리(2차/3차 이상)를 재귀적으로 <ul> 리스트로 렌더링
function renderMegaChildren(items) {
    return `<ul class="mega-sub-list">` + items.map(it => {
        if (it.children && it.children.length) {
            return `<li class="mega-group">
                <span class="mega-group-title">${it.name}</span>
                ${renderMegaChildren(it.children)}
            </li>`;
        }
        return `<li><a href="${it.url}">${it.name}</a></li>`;
    }).join('') + `</ul>`;
}

// 카테고리 하나(대분류)의 컬럼 HTML(.mega-panel-inner용)을 만듦 — 호버 패널과 "전체상품보기" 패널에서 공용으로 사용
function renderCategoryColumns(cat) {
    return (cat.children || []).map(col => {
        if (col.children && col.children.length) {
            return `<div class="mega-col">
                <div class="mega-col-title">${col.name}</div>
                ${renderMegaChildren(col.children)}
            </div>`;
        }
        return `<div class="mega-col">
            <div class="mega-col-title mega-col-title-leaf"><a href="${col.url}">${col.name}</a></div>
        </div>`;
    }).join('');
}

// 지금 보고 있는 페이지가 "메인페이지"인지 판단 (경로 끝부분 파일명으로 판단).
// 메인페이지 파일명이 바뀌면 이 배열에 이름만 추가하면 됨.
function isMainPage() {
    const MAIN_PAGE_FILENAMES = ['', 'index.html', 'index', 'main1.html', 'main1'];
    const path = location.pathname.replace(/\/+$/, ''); // 끝 슬래시 제거
    const file = path.split('/').pop() || '';
    return MAIN_PAGE_FILENAMES.includes(file);
}

// menuData → PC 메가메뉴(.mega-menu-list) 렌더링
// 맨 앞에 "전체상품보기" 아이템을 추가함: 다른 대분류(상업인쇄소 등)와 완전히 같은 방식(호버 시 .mega-panel 열림)으로 동작하되,
// 패널 안에는 모든 대분류의 링크를 대분류별로 구역을 나눠서 전부 정리해 넣음.
function renderMegaMenu() {
    const list = document.getElementById('megaMenuList');
    if (!list) return;

    const allProductsPanel = menuData.map(cat => `
        <div class="all-products-category">
            <div class="all-products-category-title">${cat.name}</div>
            <div class="mega-panel-inner">${renderCategoryColumns(cat)}</div>
        </div>`).join('');

    const allProductsItem = `
        <li class="menu-item all-products-item${isMainPage() ? ' force-open' : ''}">
            <a href="#" onclick="return false;">전체상품보기</a>
            <div class="mega-panel">${allProductsPanel}</div>
        </li>`;

    const categoryItems = menuData.map(cat => {
        return `<li class="menu-item">
            <a href="${cat.url}"${cat.url === '#' ? ' onclick="return false;"' : ''}>${cat.name}</a>
            <div class="mega-panel"><div class="mega-panel-inner">${renderCategoryColumns(cat)}</div></div>
        </li>`;
    }).join('');

    list.innerHTML = allProductsItem + categoryItems;
}

/* ---------------- 모바일 좌측 슬라이드 메뉴 렌더링 (다단계 아코디언) ---------------- */

// 하나의 노드를 재귀적으로 렌더링. leaf면 링크, 하위메뉴가 있으면 펼침/접힘 그룹
function renderMobileNode(node, depth) {
    const hasChildren = node.children && node.children.length;
    const indent = 10 + depth * 12;

    if (!hasChildren) {
        return `<a class="mobile-leaf-link" href="${node.url}" style="padding:6px ${indent}px; color:#666;">${node.name}</a>`;
    }

    const titleClass = depth === 0 ? 'mobile-cat' : 'mobile-group-title';
    const titleStyle = depth === 0
        ? `padding:10px; padding-left:${indent}px;`
        : `padding:6px 0; padding-left:${indent}px; font-size:13px;`;

    return `<div>
        <div class="${titleClass}" style="${titleStyle}" onclick="toggleSubMenu(this)">${node.name} ▾</div>
        <div class="mobile-sub-menu">
            ${node.children.map(child => renderMobileNode(child, depth + 1)).join('')}
        </div>
    </div>`;
}

// menuData → 모바일 좌측 슬라이드 메뉴(#mobileMenuList) 렌더링
function renderMobileMenu() {
    const wrap = document.getElementById('mobileMenuList');
    if (!wrap) return;
    wrap.innerHTML = menuData.map(cat => renderMobileNode(cat, 0)).join('');
}

renderMegaMenu();
renderMobileMenu();

// 메인페이지에서 "전체상품보기"가 처음엔 펼쳐진 상태로 보이다가,
// 다른 메뉴에 마우스를 올리거나 페이지 바탕 아무데나 클릭하면 접히게(원래 호버 방식으로 되돌아가게) 함.
(function initForceOpenAllProducts(){
    const item = document.querySelector('.all-products-item.force-open');
    if (!item) return;

    function closeForceOpen(){
        item.classList.remove('force-open');
        document.removeEventListener('click', onDocClick);
    }

    // 다른 메뉴 항목에 마우스를 올리면 닫힘
    document.querySelectorAll('.mega-menu-list > .menu-item').forEach(li => {
        if (li === item) return;
        li.addEventListener('mouseenter', closeForceOpen, { once: true });
    });

    // 페이지 바탕 아무데나 클릭하면 닫힘 (패널 안쪽 클릭은 제외)
    function onDocClick(e){
        if (!item.contains(e.target)) closeForceOpen();
    }
    document.addEventListener('click', onDocClick);
})();

(function() {
    // 검색 데이터도 menuData에서 자동으로 만들어집니다.
    // 트리를 재귀적으로 훑어서 실제 링크를 가진 leaf(최하위 상품) 전부를 검색 대상으로 등록합니다.
    // 표시용 이름은 "상위메뉴 › 상품명" 형태의 경로로 만들어 동명 상품을 구분합니다.
    function flattenSearch(items, path) {
        let out = [];
        items.forEach(it => {
            const newPath = path.concat([it.name]);
            if (it.children && it.children.length) {
                out = out.concat(flattenSearch(it.children, newPath));
            } else if (it.url && it.url !== '#') {
                out.push({
                    leaf: it.name,
                    display: newPath.join(' › '),
                    url: it.url
                });
            }
        });
        return out;
    }

    const searchData = menuData.flatMap(cat => flattenSearch(cat.children || [], []));

    const input = document.getElementById('searchInput');
    const suggBox = document.getElementById('suggestions');
    const searchContainer = document.querySelector('.search-container');

    window.executeSearch = function() {
        const query = input.value.trim();
        if (!query) return;
        const filtered = searchData.filter(d => d.leaf.includes(query) || d.display.includes(query));
        if (filtered.length > 0) {
            location.href = filtered[0].url;
        } else {
            suggBox.innerHTML = '<div class="suggestion-item suggestion-empty">검색내용이 없습니다.</div>';
            suggBox.style.display = 'block';
        }
    };

    // 검색창 외부 클릭 시 닫기
    document.addEventListener('click', (e) => {
        if (!searchContainer.contains(e.target)) {
            suggBox.style.display = 'none';
        }
    });

    if (input) {
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.executeSearch(); });
        input.addEventListener('input', () => {
            const val = input.value.trim();
            suggBox.innerHTML = '';
            if (val.length < 1) { suggBox.style.display = 'none'; return; }
            const filtered = searchData.filter(d => d.leaf.includes(val) || d.display.includes(val)).slice(0, 8);
            if (filtered.length > 0) {
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<span class="sg-leaf">${item.leaf}</span><br><span class="sg-path">${item.display}</span>`;
                    div.onclick = () => location.href = item.url;
                    suggBox.appendChild(div);
                });
                suggBox.style.display = 'block';
            } else {
                suggBox.innerHTML = '<div class="suggestion-item suggestion-empty">검색내용이 없습니다.</div>';
                suggBox.style.display = 'block';
            }
        });
    }
})();
</script>
