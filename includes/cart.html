<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>주문작성</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --paper:#F1F4F6;
            --surface:#FFFFFF;
            --ink:#142230;
            --ink-soft:#5B6B78;
            --ink-faint:#94A3AD;
            --line:#E1E6EA;
            --teal:#2F8F86;
            --teal-dark:#256F68;
            --blue:#2657A6;
            --blue-dark:#1D4685;
            --red:#D64545;
            --red-soft:#FBEAE9;
            --radius-lg:20px;
            --radius-md:14px;
            --radius-sm:10px;
            --shadow-card:0 1px 2px rgba(20,34,48,.04), 0 10px 28px rgba(20,34,48,.07);
        }

        *{ box-sizing:border-box; }

        /* ---------- 시안보기 모달 (새 창 대신 같은 페이지 안에서 열림 —
           브라우저 주소창/탭 높이 때문에 생기던 여백 문제를 원천적으로 없앰) ---------- */
        .composite-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(10,14,18,0.92);
            z-index:1000;
            align-items:center;
            justify-content:center;
            padding:24px;
            cursor:zoom-out;
        }
        .composite-modal.active{ display:flex; }
        .composite-modal img{
            max-width:100%;
            max-height:100%;
            display:block;
            cursor:default;
        }
        .composite-modal-close{
            position:fixed;
            top:18px; right:20px;
            background:rgba(255,255,255,0.12);
            color:#fff;
            border:1px solid rgba(255,255,255,0.25);
            border-radius:8px;
            padding:8px 14px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }
        .composite-modal-close:hover{ background:rgba(255,255,255,0.2); }

        body{
            margin:0;
            background:var(--paper);
            color:var(--ink);
            font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:transparent;
        }

        button, input{ font-family:inherit; }

        button:focus-visible,
        input:focus-visible{
            outline:2px solid var(--blue);
            outline-offset:2px;
        }

        .page{
            max-width:1080px;
            margin:0 auto;
            padding:36px 20px 80px;
        }

        /* ---------- Header ---------- */
        .page-header{ margin-bottom:26px; }
        .eyebrow{
            display:inline-block;
            font-family:'JetBrains Mono',ui-monospace,monospace;
            font-size:11px;
            font-weight:600;
            letter-spacing:.16em;
            color:var(--teal-dark);
            text-transform:uppercase;
            margin:0 0 10px;
        }
        .page-header h1{
            margin:0 0 8px;
            font-size:28px;
            font-weight:800;
            letter-spacing:-.02em;
        }
        .page-header .subtitle{
            margin:0;
            color:var(--ink-soft);
            font-size:13.5px;
            line-height:1.5;
        }

        /* ---------- Layout ---------- */
        .layout{
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        .main-col{ display:flex; flex-direction:column; gap:18px; }

        @media (min-width:960px){
            .layout{
                display:grid;
                grid-template-columns:1fr 360px;
                align-items:start;
                gap:26px;
            }
            .summary-col{ position:sticky; top:26px; }
        }

        .panel{
            background:var(--surface);
            border:1px solid var(--line);
            border-radius:var(--radius-lg);
            padding:22px;
            box-shadow:var(--shadow-card);
        }
        .panel-title{
            font-size:15px;
            font-weight:700;
            margin:0 0 14px;
        }

        /* ---------- Cart items ---------- */
        .empty-state{
            text-align:center;
            padding:38px 10px;
        }
        .empty-title{ font-weight:700; font-size:15px; margin:0 0 6px; }
        .empty-sub{ font-size:13px; color:var(--ink-soft); margin:0; }

        .cart-item{
            display:flex;
            gap:14px;
            padding:16px 0;
            border-bottom:1px solid var(--line);
        }
        .cart-item:first-child{ padding-top:2px; }
        .cart-item:last-child{ border-bottom:none; padding-bottom:2px; }

        .item-no{
            flex-shrink:0;
            width:32px;
            padding-top:2px;
            font-family:'JetBrains Mono',monospace;
            font-size:11px;
            font-weight:600;
            color:var(--ink-faint);
        }
        .item-body{ flex:1; min-width:0; }
        .item-top{

            justify-content:space-between;
            align-items:baseline;
            gap:10px;
        }
        .item-name{
            font-weight:700;
            font-size:15px;

        }
        .item-qty{

            color:var(--ink-soft);

        }
        .item-detail{

            font-size:15px;

        .field label{
            display:block;
            font-size:12.5px;
            font-weight:600;
            color:var(--ink-soft);
            margin-bottom:6px;

            font-size:14.5px;
            color:var(--ink);
            background:var(--paper);

        .field input:focus{

            border-color:var(--blue);
            background:#fff;
            box-shadow:0 0 0 3px rgba(38,87,166,.12);
        }
        .field-hint{
            margin:6px 0 0;
            font-size:11.5px;
            color:var(--ink-soft);
            line-height:1.5;
        }

        .address-row{
            display:flex;
            gap:8px;
        }
        .address-row input{

            min-width:0;
            cursor:pointer;
            background:var(--surface);
        }
        .address-row input::placeholder{ color:var(--ink-faint); }
        .address-search-btn{
            flex-shrink:0;
            padding:0 16px;
            border:1.5px solid var(--line);
            border-radius:var(--radius-sm);
            background:var(--surface);
            color:var(--ink);
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            white-space:nowrap;
            transition:border-color .15s, background .15s;
        }
        .address-search-btn:hover{
            border-color:var(--blue);
            background:var(--paper);
        }

        .receipt{
            position:relative;
            overflow:hidden;
            padding-top:22px;
        }
        .receipt-head h2{
            margin:2px 0 0;
            font-size:18px;
            font-weight:800;
        }
        .receipt-divider{
            position:relative;
            height:0;
            margin:18px 0;
            border:none;
            border-top:1px dashed var(--line);
        }
        .receipt-divider::before,
        .receipt-divider::after{
            content:"";
            position:absolute;
            top:50%;
            width:20px;
            height:20px;
            border-radius:50%;
            background:var(--paper);
            transform:translateY(-50%);
        }
        .receipt-divider::before{ left:-32px; }
        .receipt-divider::after{ right:-32px; }

        .total-price{
            font-family:'JetBrains Mono',monospace;
            font-size:18px;
            font-weight:700;
            letter-spacing:-.01em;
            margin:0 0 18px;
            padding:14px 16px;
            background:var(--paper);
            border-radius:var(--radius-sm);
            text-align:right;
        }

        .pay-actions{
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .pay-btn{
            width:100%;
            padding:15px;
            background:var(--blue);
            color:#fff;
            border:none;
            border-radius:var(--radius-sm);
            font-size:15.5px;
            font-weight:700;
            cursor:pointer;
            transition:background .15s, transform .05s;
        }
        .pay-btn:hover{ background:var(--blue-dark); }
        .pay-btn:active{ transform:scale(.99); }
        .pay-btn:disabled{ background:#B7C3D6; cursor:not-allowed; }

        .bank-btn{
            width:100%;
            padding:15px;
            background:var(--surface);
            color:var(--ink);
            border:1.5px solid var(--line);
            border-radius:var(--radius-sm);
            font-size:15.5px;
            font-weight:700;
            cursor:pointer;
            transition:border-color .15s, background .15s;
        }
        .bank-btn:hover{ border-color:var(--ink); background:var(--paper); }
        .bank-btn:disabled{ opacity:.6; cursor:not-allowed; }

            margin-top:12px;
            padding:12px 14px;
            background:var(--red-soft);
            color:var(--red);
            border-radius:var(--radius-sm);
            font-size:12.5px;
            font-weight:700;
            line-height:1.6;
            text-align:center;
        }
        .item-broken-badge{
            display:inline-block;
            margin-top:4px;
            padding:2px 8px;
            background:var(--red-soft);
            color:var(--red);
            border-radius:20px;
            font-size:11px;
            font-weight:700;
        }

        .receipt-footnote{
            margin:16px 0 0;
            font-size:11px;
            color:var(--ink-soft);
            line-height:1.5;
            text-align:center;
        }

        @media (prefers-reduced-motion:reduce){
            *{ transition:none !important; animation:none !important; }
        }

        @media (max-width:480px){
            .page{ padding:26px 14px 60px; }
            .panel{ padding:18px; }
            .page-header h1{ font-size:24px; }
        }
    </style>

<script>
// 장바구니(cart) 저장소 — 원래 localStorage를 썼는데, 도메인당 5~10MB 한도라
// 아직 R2에 안 올라간 원본 이미지(SVG/고해상도 JPEG data URL)를 여러 개 담으면
// 금방 한도를 넘겨버려서 "용량이 너무 커서 저장 실패" 오류가 났음. 한도가 훨씬
// 넉넉한 IndexedDB로 교체함 (sian.html이 장바구니에 담을 때 쓰는 것과 동일한
// DB/스토어 이름을 써야 서로 읽고 쓸 수 있음).
const HANDOFF_DB_NAME = 'ecogrHandoff';
const HANDOFF_STORE_NAME = 'kv';
const CART_KEY = 'ecogr_cart';
// 카트 보관시간 — 카트에 상품이 처음 담긴 것을 이 페이지가 확인한 시점부터 1시간 후 전체 삭제.
// (sian.html에서 담는 시점 자체는 이 파일이 알 수 없어서, cart.html이 그 상태를 처음 확인한
// 시점을 기준으로 타이머를 시작함)
const CART_EXPIRY_KEY = 'ecogr_cart_expires_at';
const CART_TTL_MS = 60 * 60 * 1000; // 1시간
function openHandoffDB(){
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(HANDOFF_DB_NAME, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(HANDOFF_STORE_NAME); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function idbSet(key, value){
    const db = await openHandoffDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(HANDOFF_STORE_NAME, 'readwrite');
        tx.objectStore(HANDOFF_STORE_NAME).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
async function idbGet(key){
    const db = await openHandoffDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(HANDOFF_STORE_NAME, 'readonly');
        const req = tx.objectStore(HANDOFF_STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function idbDelete(key){
    const db = await openHandoffDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(HANDOFF_STORE_NAME, 'readwrite');
        tx.objectStore(HANDOFF_STORE_NAME).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

// 각 결제 수단별 독립적인 Worker 주소
const WORKER_CARD = "https://proud-math-2d41.ecogr.workers.dev/"; 
const WORKER_PAYPAL = "";

// ---- Cloudflare Worker를 통한 실제 R2 업로드 (시안에서 넘어온 원본 이미지들을 여기서 업로드) ----
const R2_WORKER_URL = "https://r2.ecogr.workers.dev/";
const R2_MAX_FILE_SIZE = 500 * 1024 * 1024; // 500MB
const R2_ALLOWED_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];

function getExtFromFilename(filename, fallback){
    const ext = (filename.split('.').pop() || '').toLowerCase();
    return ext || fallback;
}

// data URL(또는 일반 URL) 문자열을 Blob으로 변환
async function urlToBlob(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error(`이미지를 불러오지 못했습니다 (status ${res.status})`);
    return await res.blob();
}

// filename의 파일을 PUT으로 Worker(R2)에 올리고, 업로드된 파일의 URL을 돌려받는다.
// Worker 응답이 JSON({url:"..."}) 이든, URL 문자열 그대로든 둘 다 처리한다.
async function uploadFileToR2(blob, filename){
    const ext = getExtFromFilename(filename, 'jpg');
    if(!R2_ALLOWED_EXTENSIONS.includes(ext)){
        throw new Error(`허용되지 않는 파일 형식입니다: .${ext}`);
    }
    if(blob.size > R2_MAX_FILE_SIZE){
        throw new Error(`파일 크기가 너무 큽니다. (최대 500MB, 현재 ${(blob.size / 1024 / 1024).toFixed(1)}MB)`);
    }

    // 예시 페이지(정상 동작 중)와 동일하게 파일명을 쿼리스트링(?name=)으로 전달합니다.
    const res = await fetch(`${R2_WORKER_URL}?name=${encodeURIComponent(filename)}`, {
        method: 'PUT',
        body: blob
    });

    if(!res.ok){
        throw new Error(`R2 업로드 실패 (status ${res.status})`);
    }

    let fileUrl = '';
    try {
        const data = await res.clone().json();
        fileUrl = data.url || data.fileUrl || '';
    } catch(e){ /* JSON이 아니면 아래에서 텍스트로 재시도 */ }

    if(!fileUrl){
        fileUrl = (await res.text()).trim();
    }

    if(!fileUrl){
        throw new Error('R2 응답에서 파일 URL을 찾을 수 없습니다.');
    }
    return fileUrl;
}

// 장바구니에 담긴 항목 중 아직 R2에 업로드되지 않은 원본 이미지들(item.originalImages)을
// 모두 업로드하고, 결과 URL을 item.originalImageUrls 에 채워 넣은 뒤 localStorage에 반영한다.
// 카드결제 시작 직전에 호출한다.
async function uploadRemainingOriginals(onProgress){
    let total = 0, done = 0;
    cart.forEach(item => { if(Array.isArray(item.originalImages)) total += item.originalImages.length; });

    for(const item of cart){
        if(!Array.isArray(item.originalImages) || item.originalImages.length === 0) continue;

        const uploadedUrls = [];
        for(const orig of item.originalImages){
            const blob = await urlToBlob(orig.sourceUrl);
            const url = await uploadFileToR2(blob, orig.filename);
            uploadedUrls.push({ filename: orig.filename, url });
            done++;
            if(onProgress) onProgress(done, total);
        }

        item.originalImageUrls = uploadedUrls;
        delete item.originalImages; // 업로드가 끝난 원본 데이터(용량이 큰 data URL)는 더 이상 들고 있지 않는다.
    }

    await idbSet(CART_KEY, cart);
}

// ---- 만료된(깨진) 시안 이미지 감지 -> 결제 차단 ----
let brokenImageIndexes = new Set(); // 로드 실패(만료)한 시안 이미지가 있는 cart index들

function testImageLoads(url){
    return new Promise((resolve) => {
        if(!url){ resolve(false); return; }
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}

// 상품 하나의 시안 이미지가 정상인지 확인. compositeImage가 실패하면 fallback도 시도.
// 애초에 시안 이미지 URL 자체가 없는 상품(기존 방식)은 "만료"가 아니라 "없음"이므로 통과시킴.
async function checkItemImage(item){
    const primary = (item.compositeImage && /^https?:\/\//.test(item.compositeImage)) ? item.compositeImage : '';
    const fallback = (item.compositeImageFallback && /^https?:\/\//.test(item.compositeImageFallback)) ? item.compositeImageFallback : '';

    if(!primary && !fallback) return true; // 표시할 시안 이미지 자체가 없음 -> 만료 판정 대상 아님

    if(primary && await testImageLoads(primary)) return true;
    if(fallback && await testImageLoads(fallback)) return true;
    return false; // 있는 이미지가 전부 로드 실패 -> 만료(깨진 링크)
}

async function validateCartImages(){
    const newBroken = new Set();
    await Promise.all(cart.map(async (item, index) => {
        const ok = await checkItemImage(item);
        if(!ok) newBroken.add(index);
    }));
    brokenImageIndexes = newBroken;
    render();
    updateCheckoutAvailability();
}

function updateCheckoutAvailability(){
    const hasBroken = brokenImageIndexes.size > 0;

    const bankBtn = document.getElementById('payBankBtn');
    if(cardBtn) cardBtn.disabled = hasBroken;
    if(bankBtn) bankBtn.disabled = hasBroken;
    const warningEl = document.getElementById('broken-image-warning');
    if(warningEl) warningEl.style.display = hasBroken ? 'block' : 'none';
}

function validateOrderForm(){

function render(){
    const list = document.getElementById("cart-list");
    let subtotal = 0;

    if(cart.length === 0){
        list.innerHTML = `<div class="empty-state">
            <p class="empty-title">담긴 상품이 없어요</p>
            <p class="empty-sub">시안 페이지에서 주문할 상품을 먼저 담아주세요.</p>
        </div>`;
    } else {
        list.innerHTML = "";
        cart.forEach((item,index)=>{
            // price가 "12,345원" 같은 문자열로 들어와도 안전하게 숫자로 변환
            const priceNumber = Number(String(item.price).replace(/[^0-9.-]/g, '')) || 0;
            subtotal += priceNumber;

            // 01my.html → 에코프로1 → 시안보기를 거쳐 넘어온 상세 주문정보(용지/편집/후가공/무게)가
            // 있으면 함께 표시하고, 없으면(기존 방식으로 담긴 항목) 기본 정보만 표시한다.
            const detailLines = [
                (item.width && item.height) ? `${item.width} × ${item.height}mm` : '',
                item.paper ? `용지: ${item.paper}` : '',
                item.ink ? `편집: ${item.ink}` : '',
                item.finishings ? `후가공: ${item.finishings}` : '',
                item.weight ? `무게: 약 ${item.weight}kg` : ''
            ].filter(Boolean).join('<br/>');

            list.innerHTML += `
            <div class="cart-item">
                <div class="item-no">No.${String(index + 1).padStart(2, '0')}</div>
                <div class="item-body">
                    <div class="item-top">
                        <div class="item-name">${item.item}</div>
                        <div class="item-qty">${item.qty}개${item.count && item.count != 1 ? ` × ${item.count}건` : ''}</div>
                    </div>
                    ${detailLines ? `<div class="item-detail">${detailLines}</div>` : ''}
                    <div class="item-price">${priceNumber.toLocaleString()}원</div>
                    ${brokenImageIndexes.has(index) ? `<div class="item-broken-badge">⚠ 시안 이미지 만료됨</div>` : ''}
                </div>
                <div class="item-actions">
                    ${ brokenImageIndexes.has(index)
                        ? `<button disabled class="item-btn view-btn disabled">만료됨</button>`
                        : (item.compositeImage && /^https?:\/\//.test(item.compositeImage)) || (item.compositeImageFallback && /^https?:\/\//.test(item.compositeImageFallback))
                            ? `<button onclick="viewComposite(${index})" class="item-btn view-btn">시안보기</button>`
                            : `<button disabled class="item-btn view-btn disabled">시안보기</button>` }
                    <button onclick="deleteItem(${index})" class="item-btn delete-btn">삭제</button>
                </div>
            </div>`;
        });
    }

    // shipping.js의 calculateShippingFee()로 묶음배송 여부 + 무게 구간 + 착불(제주/울릉) 여부를 반영해 배송비 계산.
    // 이 파일의 cart 항목은 상품명이 item.item에 들어있어서, shipping.js가 기대하는
    // productName 필드로 맞춰서 전달한다.
    const addressForShipping = (document.getElementById('address')?.value || '')
        + ' ' + (document.getElementById('detailAddress')?.value || '');
    const mappedForShipping = cart.map(it => ({
        productId: it.productId || '',
        productName: it.item || it.productName || it.name || '',
        weight: it.weight,
        options: it.options
    }));
    const shippingResult = (typeof calculateShippingFee === 'function')
        ? calculateShippingFee(mappedForShipping, addressForShipping)
        : { totalFee: 0, breakdown: [], cashOnDelivery: false };
    const shippingFee = shippingResult.totalFee;
    total = subtotal + shippingFee;

    const totalPriceEl = document.getElementById("total-price");
    const totalLabel = `<span style="color:var(--blue);">총 결제금액</span>`;
    if(cart.length === 0){
        totalPriceEl.innerHTML = `<div>${totalLabel} : 0원</div>`;
    } else if(shippingResult.cashOnDelivery){
        totalPriceEl.innerHTML = `
            <div>${totalLabel} : ${total.toLocaleString()}원</div>
            <div style="font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:4px;">배송비 착불·도서산간 — 상품 도착 시 별도 결제</div>`;
    } else if(shippingFee > 0){
        totalPriceEl.innerHTML = `
            <div>${totalLabel} : ${total.toLocaleString()}원</div>
            <div style="font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:4px;">상품 ${subtotal.toLocaleString()}원 + 배송비 ${shippingFee.toLocaleString()}원</div>`;
    } else {
        totalPriceEl.innerHTML = `<div>${totalLabel} : ${total.toLocaleString()}원</div>`;
    }
}

// R2 원본(compositeImage)을 1차로 보여주고, 나중에 관리자가 R2에서 지우고
// 카페24로 옮겨두면(compositeImageFallback) 로드 실패 시 자동으로 그쪽을 대신 보여줌
window.viewComposite = function(index){
    const item = cart[index];
    if(!item) return;
    const primary = item.compositeImage || item.compositeImageFallback;
    const fallback = item.compositeImageFallback;
    if(!primary) return;
    const modalImg = document.getElementById('composite-modal-img');
    const overlay = document.getElementById('composite-modal');
    modalImg.onerror = () => {
        if (fallback && modalImg.src !== fallback) {
            modalImg.onerror = null;
            modalImg.src = fallback;
        } else {
            modalImg.onerror = null;
        }
    };
    modalImg.src = primary;
    overlay.classList.add('active');
};
window.closeCompositeModal = function(){
    const overlay = document.getElementById('composite-modal');
    overlay.classList.remove('active');
    document.getElementById('composite-modal-img').src = '';
    document.getElementById('composite-modal-img').onerror = null;
};

// [3] 핵심 결제 처리 엔진 (공통)
async function processPayment(paymentType, payMethod, currency, channelKey, storeId) {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim() + " " + document.getElementById("detailAddress").value.trim();

    if(!validateOrderForm()){ return; }

    try {
        const paymentId = "PAY_" + Date.now();
        const orderData = saveOrder(paymentType, paymentId);

        const response = await PortOne.requestPayment({
            storeId: storeId,
            channelKey: channelKey,
            paymentId: paymentId,
            orderName: "주문상품",
            totalAmount: Number(total),
            currency: currency,
            payMethod: payMethod,
            customer: { name: name, phoneNumber: String(phone) }
        });

        if(response.code != null){ alert("결제 실패: " + response.message); return; }

        await saveOrderToFirestore(orderData);
        await idbDelete(CART_KEY);
        await idbDelete(CART_EXPIRY_KEY);
        location.href = "success.html";
    } catch(error) {
        console.error(error);
        alert("결제창 호출 실패. 서버 연결을 확인하세요.");
    }
}

        } else if(expiresAt){

            await idbDelete(CART_EXPIRY_KEY);

        // 페이지를 계속 열어둔 상태로 보관시간이 지나면, 새로고침 없이도 자동으로 비움
        if(expiresAt && expiresAt > now){
            setTimeout(async () => {
                cart = [];
                await idbDelete(CART_KEY);
                await idbDelete(CART_EXPIRY_KEY);
                render();
                validateCartImages();
                alert('장바구니 보관 시간(1시간)이 지나 담아두신 상품이 모두 삭제되었습니다.\n다시 담아주세요.');
            }, expiresAt - now);
        }
    } catch (e) {
        console.error('장바구니 보관시간 처리 실패:', e);
    }

    render();
    validateCartImages();
})();
</script>

</body>
</html>
