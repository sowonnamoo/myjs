<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SVG · 이미지 편집기 (모바일)</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Pretendard','Noto Sans KR',sans-serif;background:#f2f3f4;color:#33373d;}
  .wrap{
    min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;gap:14px;
  }
  .emoji{font-size:52px;line-height:1;}
  h1{font-size:19px;font-weight:700;margin:4px 0 0;}
  p{font-size:14px;color:#6b7280;line-height:1.6;margin:0;max-width:320px;}
  .desktop-link{
    margin-top:18px;display:inline-block;padding:12px 22px;border-radius:10px;
    background:#3498db;color:#fff;text-decoration:none;font-size:14px;font-weight:700;
  }
  .desktop-link:active{background:#2980b9;}
  .hint{font-size:12px;color:#9aa2ad;margin-top:6px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">📱</div>
    <h1>모바일 버전을 준비 중이에요</h1>
    <p>지금은 PC(가로 화면)에서 최적화된 에디터예요.<br>모바일 전용 화면은 곧 만나보실 수 있어요.</p>
    <a class="desktop-link" href="#" id="desktopLink">그래도 PC 버전으로 보기</a>
    <div class="hint">화면이 작아 일부 버튼은 누르기 불편할 수 있어요</div>
  </div>
  <script>
    // 지금 주소의 쿼리스트링/해시를 그대로 유지한 채 "?desktop=1"만 덧붙여서 데스크톱
    // 에디터(ecopro3.html)로 넘어감 — 그래야 ecopro3.html의 모바일 자동리다이렉트에 안 걸림
    var params = new URLSearchParams(location.search);
    params.set('desktop', '1');
    document.getElementById('desktopLink').href = 'ecopro3.html?' + params.toString() + location.hash;
  </script>
</body>
</html>
