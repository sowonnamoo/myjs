<!-- success.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>결제 완료</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
    :root{
        --paper:#F1F4F6;
        --surface:#FFFFFF;
        --ink:#142230;
        --ink-soft:#5B6B78;
        --ink-faint:#94A3AD;
        --line:#E1E6EA;
        --teal:#2F8F86;
        --teal-dark:#256F68;
        --teal-soft:#E7F3F1;
        --blue:#2657A6;
        --blue-soft:#EAF1FB;
        --radius-lg:20px;
        --radius-md:14px;
        --radius-sm:10px;
        --shadow-card:0 1px 2px rgba(20,34,48,.04), 0 10px 28px rgba(20,34,48,.07);
    }

    *{ box-sizing:border-box; }

    body{
        margin:0;
        background:var(--paper);
        color:var(--ink);
        font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
        -webkit-font-smoothing:antialiased;
    }

    .wrap{
        max-width:560px;
        margin:0 auto;
        padding:40px 20px 60px;
    }

    /* ---------- Status header ---------- */
    .status-head{
        text-align:center;
        margin-bottom:22px;
    }
    .status-icon{
        width:64px; height:64px;
        margin:0 auto 16px;
        border-radius:50%;
        background:var(--teal-soft);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;
    }
    .status-title{
        font-size:23px;
        font-weight:800;
        letter-spacing:-.02em;
        margin:0 0 6px;
    }
    .status-sub{
        font-size:13.5px;
        color:var(--ink-soft);
        margin:0;
        line-height:1.6;
    }

    /* ---------- Panels ---------- */
    .panel{
        background:var(--surface);
        border:1px solid var(--line);
        border-radius:var(--radius-lg);
        padding:22px;
        box-shadow:var(--shadow-card);
        margin-top:16px;
    }
    .panel-title{
        font-family:'JetBrains Mono',ui-monospace,monospace;
        font-size:11px;
        font-weight:700;
        letter-spacing:.14em;
        text-transform:uppercase;
        color:var(--teal-dark);
        margin:0 0 14px;
    }

    /* ---------- Order meta rows ---------- */
    .meta-row{
        display:flex;
        justify-content:space-between;
        align-items:baseline;
        gap:12px;
        padding:9px 0;
        border-bottom:1px solid var(--line);
        font-size:13.5px;
    }
    .meta-row:last-child{ border-bottom:none; }
    .meta-label{ color:var(--ink-soft); flex-shrink:0; }
    .meta-value{
        text-align:right;
        font-weight:600;
        overflow-wrap:anywhere;
    }
    .meta-value.mono{ font-family:'JetBrains Mono',monospace; }

    /* ---------- Items ---------- */
    .order-item{
        display:flex;
        gap:12px;
        padding:12px 0;
        border-bottom:1px solid var(--line);
    }
    .order-item:last-child{ border-bottom:none; padding-bottom:0; }
    .order-item:first-child{ padding-top:0; }
    .item-thumb{
        width:52px; height:52px;
        border-radius:10px;
        object-fit:cover;
        background:var(--paper);
        border:1px solid var(--line);
        flex-shrink:0;
    }
    .item-thumb.placeholder{
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:20px;
        color:var(--ink-faint);
    }
    .item-info{ flex:1; min-width:0; }
    .item-name{
        font-weight:700;
        font-size:14px;
        overflow-wrap:anywhere;
    }
    .item-sub{
        margin-top:3px;
        font-size:12px;
        color:var(--ink-soft);
        line-height:1.6;
    }
    .item-price{
        margin-top:5px;
        font-family:'JetBrains Mono',monospace;
        font-weight:700;
        font-size:13.5px;
    }

    /* ---------- Total ---------- */
    .total-row{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:6px;
        padding-top:14px;
        border-top:1.5px solid var(--ink);
    }
    .total-label{ font-size:14px; font-weight:700; }
    .total-amount{
        font-family:'JetBrains Mono',monospace;
        font-size:21px;
        font-weight:800;
        color:var(--teal-dark);
    }

    /* ---------- Payment badge ---------- */
    .payment-badge{
        display:inline-flex;
        align-items:center;
        gap:6px;
        background:var(--blue-soft);
        color:var(--blue);
        font-size:12.5px;
        font-weight:700;
        padding:8px 14px;
        border-radius:999px;
        margin-top:16px;
    }

    /* ---------- Button ---------- */
    .home-btn{
        width:100%;
        height:52px;
        border:none;
        background:var(--ink);
        color:#fff;
        border-radius:var(--radius-md);
        margin-top:22px;
        cursor:pointer;
        font-size:15px;
        font-weight:700;
        transition:background .15s, transform .15s;
    }
    .home-btn:hover{ background:#26333F; transform:translateY(-1px); }
    .home-btn:active{ transform:translateY(0); }

    .empty-order{
        text-align:center;
        padding:30px 10px;
        color:var(--ink-soft);
        font-size:14px;
    }

    @media (max-width:420px){
        .wrap{ padding:28px 14px 50px; }
        .panel{ padding:18px; }
    }
</style>
</head>

<body>

<div class="wrap">

    <div class="status-head">
        <div class="status-icon">✅</div>
        <h1 class="status-title">결제가 완료되셨습니다.</h1>
        <p class="status-sub">바로 제작이 시작됩니다.<br>진행 상황은 주문내역 조회 페이지에서 확인하실 수 있습니다.<br>
(주문시 오류사항이 있는 경우 문자발송 드립니다.)</p>
    </div>

    <div id="order-detail"></div>

    <button class="home-btn" onclick="goHome()">홈으로 이동</button>

</div>

<script>

const order = JSON.parse(localStorage.getItem("latestOrder"));
const detailEl = document.getElementById("order-detail");

function formatDate(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '-';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

if(order){

    const items = Array.isArray(order.items) ? order.items : [];
    const totalNumber = Number(String(order.total).replace(/[^0-9.-]/g, '')) || 0;

    const itemRows = items.map(it => {
        const priceNumber = Number(String(it.price).replace(/[^0-9.-]/g, '')) || 0;
        const qtyLabel = `${it.qty || 1}개${it.count && it.count != 1 ? ` × ${it.count}건` : ''}`;
        const specLine = [
            (it.width && it.height) ? `${it.width} × ${it.height}mm` : '',
            it.paper ? `용지: ${it.paper}` : '',
            it.ink ? `인쇄면: ${it.ink}` : '',
            it.finishings ? `후가공: ${it.finishings}` : ''
        ].filter(Boolean).join(' · ');

        const thumb = it.compositeImage
            ? `<img class="item-thumb" src="${it.compositeImage}" alt="">`
            : `<div class="item-thumb placeholder">📦</div>`;

        return `
        <div class="order-item">
            ${thumb}
            <div class="item-info">
                <div class="item-name">${it.item || '상품'}</div>
                <div class="item-sub">${qtyLabel}${specLine ? ' · ' + specLine : ''}</div>
                <div class="item-price">${priceNumber.toLocaleString()}원</div>
            </div>
        </div>`;
    }).join('');

    detailEl.innerHTML = `
        <div style="text-align:center;">
            <span class="payment-badge">💳 ${order.payment || '카드결제'} 승인 완료</span>
        </div>

        <div class="panel">
            <p class="panel-title">주문 정보</p>
            <div class="meta-row"><span class="meta-label">주문번호</span><span class="meta-value mono">${order.orderId || '-'}</span></div>
            <div class="meta-row"><span class="meta-label">주문일시</span><span class="meta-value">${formatDate(order.createdAt)}</span></div>
            <div class="meta-row"><span class="meta-label">주문자</span><span class="meta-value">${order.name || '-'}</span></div>
            <div class="meta-row"><span class="meta-label">연락처</span><span class="meta-value">${order.phone || '-'}</span></div>
            <div class="meta-row"><span class="meta-label">배송지</span><span class="meta-value">${order.address || '-'}</span></div>
        </div>

        <div class="panel">
            <p class="panel-title">주문 상품 (${items.length}건)</p>
            ${itemRows || '<div class="empty-order">상품 정보가 없습니다.</div>'}
            <div class="total-row">
                <span class="total-label">총 결제금액</span>
                <span class="total-amount">${totalNumber.toLocaleString()}원</span>
            </div>
        </div>
    `;

}else{

    detailEl.innerHTML = `
        <div class="panel">
            <div class="empty-order">주문 정보를 찾을 수 없습니다.<br>주문 내역 조회 페이지에서 확인해주세요.</div>
        </div>
    `;
}

function goHome(){
    location.href = "index.html";
}

</script>

</body>
</html>
