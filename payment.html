<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 결제</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzHogA2iaUQqOOsNVL55stsdMH8lCQ4Ek",
            authDomain: "ecogr-636c6.firebaseapp.com",
            projectId: "ecogr-636c6",
            storageBucket: "ecogr-636c6.firebasestorage.app",
            messagingSenderId: "95745358447",
            appId: "1:95745358447:web:94cde53f6b36e6be95eb9a"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.addDoc = addDoc;
        window.collection = collection;
    </script>
    <style>
        @keyframes blink-red-black { 0% { color: #1f2937; } 50% { color: #dc2626; } 100% { color: #1f2937; } }
        .blink-text { animation: blink-red-black 1.5s infinite; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm text-center">
        <h2 class="text-xl font-bold mb-6 text-gray-800">결제 상세정보</h2>
        <div class="mb-6">
            <p class="text-gray-500 text-sm">결제 예정 금액</p>
            <div id="display-price" class="text-3xl font-bold text-blue-600 mt-2">0원</div>
        </div>
        <button id="pay-card-btn" onclick="requestPayment('CARD')" class="w-full py-3 bg-blue-900 text-white font-bold rounded hover:bg-blue-800 transition">신용카드</button>
        <button id="pay-transfer-btn" onclick="requestPayment('TRANSFER')" class="w-full py-3 mt-2 bg-emerald-700 text-white font-bold rounded hover:bg-emerald-600 transition">계좌이체</button>
        <div class="p-3 rounded text-left text-xs text-gray-600 mt-4">
            <div class="flex items-center gap-2 mb-1 font-bold blink-text"><span>카드사 선택 후 결제창이 뜨지 않을 때</span></div>
            <p>인터넷 창 우측 상단 <strong>팝업 아이콘</strong>을 클릭하여 <strong>"항상 허용"</strong>으로 변경해주세요.</p>
        </div>
    </div>

    <!-- 결제 성공 모달 (기본 숨김) -->
    <div id="success-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-xs text-center">
            <div class="text-5xl mb-4">✅</div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">결제가 완료되었습니다</h3>
            <p class="text-sm text-gray-500">잠시 후 창이 자동으로 닫힙니다.</p>
        </div>
    </div>

    <!-- [추가] 장시간 미결제 안내 모달 (기본 숨김) -->
    <div id="timeout-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-xs text-center">
            <div class="text-5xl mb-4">⏰</div>
            <h3 class="text-lg font-bold text-gray-800 mb-4">장시간 미결제로 종료되었습니다.</h3>
            <button id="timeout-confirm-btn" class="w-full py-3 bg-gray-700 text-white font-bold rounded hover:bg-gray-600 transition">확인</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const price = urlParams.get('price');
        const totalAmount = Number(price) || 0;
        document.getElementById("display-price").innerText = totalAmount.toLocaleString() + "원";

        // [추가] 결제창을 20분 넘게 열어두고 결제를 안 하면, 화면 가운데에 경고창을 띄우고
        // 결제 버튼을 완전히 막습니다. "확인"을 누르면 창이 닫힙니다.
        // (창이 닫히면 부모 페이지의 기존 감지 로직이 "결제 취소"로 처리하고,
        //  주문 자체는 이미 '대기' 상태로 저장되어 있으므로 나중에 다시 결제하면 됩니다.)
        let paymentTimedOut = false;
        const PAYMENT_TIMEOUT_MS = 20 * 60 * 1000; // 20분
        const paymentTimeoutTimer = setTimeout(() => {
            paymentTimedOut = true;
            const cardBtn = document.getElementById('pay-card-btn');
            const transferBtn = document.getElementById('pay-transfer-btn');
            cardBtn.disabled = true;
            transferBtn.disabled = true;
            cardBtn.classList.add('opacity-50');
            transferBtn.classList.add('opacity-50');
            document.getElementById('timeout-modal').classList.remove('hidden');
        }, PAYMENT_TIMEOUT_MS);

        document.getElementById('timeout-confirm-btn').addEventListener('click', () => {
            window.close();
        });

        // method: 'CARD' 또는 'TRANSFER'(계좌이체)
        window.requestPayment = async function(method) {
            if (paymentTimedOut) return; // 시간 초과 후에는 절대 결제 진행 안 함
            if (totalAmount <= 0) return alert("결제 금액 오류");

            const cardBtn = document.getElementById('pay-card-btn');
            const transferBtn = document.getElementById('pay-transfer-btn');
            cardBtn.disabled = true;
            transferBtn.disabled = true;
            cardBtn.classList.add('opacity-50');
            transferBtn.classList.add('opacity-50');

            try {
                const res = await fetch("https://proud-math-2d41.ecogr.workers.dev/");
                const data = await res.json();
                const paymentId = "PAY_" + Date.now();
                const phone = localStorage.getItem("userPhone") || "정보없음";

                // 계좌이체용 채널키가 워커 응답에 별도로 있으면 그걸 쓰고,
                // 없으면 카드결제와 같은 채널키로 시도합니다.
                const channelKey = method === 'TRANSFER'
                    ? (data.CHANNEL_KEY_TRANSFER || data.CHANNEL_KEY_CARD)
                    : data.CHANNEL_KEY_CARD;

                const response = await PortOne.requestPayment({
                    storeId: data.STORE_ID,
                    channelKey: channelKey,
                    paymentId: paymentId,
                    orderName: "주문 상품 결제",
                    totalAmount: totalAmount,
                    currency: "KRW",
                    payMethod: method
                });

                if (response.code != null) return alert("결제 실패: " + response.message);

                clearTimeout(paymentTimeoutTimer); // 결제 성공했으니 타임아웃 타이머는 더 이상 필요 없음

                // ---- 결제기록(cards1) 저장 ----
                // 이 기록이 실패해도(권한 오류 등) 결제 자체는 이미 성공한 것이므로
                // 아래 로직은 반드시 실행되어야 합니다. 그래서 별도 try/catch로 분리합니다.
                try {
                    await addDoc(collection(window.db, "cards1"), {
                        paymentId: paymentId,
                        tno: response.pgTxId || response.txId, // 일단 기존 방식 유지
                        amount: totalAmount,
                        phone: phone,
                        payMethod: method,
                        status: "결제완료 / 창을 닫아주세요.",
                        createdAt: new Date().toISOString(),
                        fullData: response
                    });
                } catch (logError) {
                    // 결제기록 저장 실패는 결제 성공 여부와 무관하므로, 콘솔에만 남기고 진행합니다.
                    console.error("cards1 기록 실패(결제 자체는 성공):", logError);
                }

                // ---- 부모창(주문 상세 페이지)에 결제 성공을 알림 ----
                // app.js가 이미 이 메시지를 받아서 "지금 보고 있는 그 주문(currentViewId)"만
                // 정확히 '카드결제'로 바꿔주는 로직을 갖고 있습니다(가격으로 여러 문서를 추측하지 않음).
                // payment.html과 index.html은 실제로는 같은 origin(sowonnamoo.github.io)이라
                // postMessage는 경로(myjs vs myboard)가 달라도 아무 문제 없이 전달됩니다.
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage(
                        { type: 'PAYMENT_SUCCESS', price: totalAmount, payMethod: method },
                        'https://sowonnamoo.github.io'
                    );
                }

                // ---- 이 창 안에서 바로 완료 안내 후 자동으로 닫기 ----
                // 별도 success4 페이지로 이동할 필요 없이, 이 팝업 자체가 결제 완료 화면 역할을 합니다.
                document.getElementById('success-modal').classList.remove('hidden');
                setTimeout(() => window.close(), 1800);

            } catch (error) {
                console.error(error);
                alert("결제 처리 중 오류가 발생했습니다.");
            } finally {
                cardBtn.disabled = false;
                transferBtn.disabled = false;
                cardBtn.classList.remove('opacity-50');
                transferBtn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
